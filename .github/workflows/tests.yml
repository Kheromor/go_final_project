name: Go

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.24.x]
  
    steps:
    - uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.x'
        
    - name: Display Go version
      run: go version

    - name: Install dependencies
      run: go mod tidy

    - name: Run local server
      run: |
        export TODO_PORT=7541
        CGO_ENABLED=0 GOOS=linux go run main.go > /tmp/todo-server.log 2>&1 &
        SERVER_PID=$!
        for i in $(seq 1 30); do
          curl -sf "http://localhost:${TODO_PORT}/login.html" >/dev/null && break
          sleep 1
        done
        TODO_PORT=${TODO_PORT} go test -run ^TestApp$ ./tests
        kill $SERVER_PID || true
        
        